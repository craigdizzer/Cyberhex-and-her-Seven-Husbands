<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberhex and Her 7 Husbands</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Pirata+One&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background-color: #0b090d;
      color: #e6dee9;
      font-family: 'Cormorant Garamond', Georgia, serif;
      min-height: 100vh;
    }
    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      background: linear-gradient(180deg, #281724 0%, #170f16 100%);
      border-bottom: 1px solid #7a556e;
    }
    .nav-bar.bottom {
      border-bottom: none;
      border-top: 1px solid #7a556e;
    }
    .nav-btn {
      background-color: #1c121b;
      color: #f3eaf7;
      text-decoration: none;
      padding: 9px 14px;
      border-radius: 5px;
      border: 1px solid #7a556e;
      font-family: 'Pirata One', Georgia, serif;
      font-size: 1.05rem;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .nav-btn:hover {
      background-color: #3a2034;
      border-color: #b58ca8;
    }
    .nav-btn.hidden {
      visibility: hidden;
      pointer-events: none;
    }
    .info-bar {
      text-align: center;
      padding: 8px 12px;
      font-size: 1.05rem;
      color: #c7bccf;
      background-color: #120e15;
      border-bottom: 1px solid #2c202e;
    }
    .info-bar a {
      color: #e0b8d4;
    }
    #bookPages {
      max-width: 820px;
      margin: 0 auto;
      padding: 14px 10px 24px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .status-msg {
      padding: 24px 14px;
      font-size: 1.2rem;
      color: #c7bccf;
      text-align: center;
    }
    canvas.pdf-page {
      width: 100%;
      max-width: 780px;
      height: auto;
      border-radius: 6px;
      border: 1px solid #4a374c;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.75);
      background-color: #16111a;
    }
  </style>
</head>
<body>

  <div class="nav-bar">
    <a id="prevTop" class="nav-btn" href="#">Prev</a>
    <a class="nav-btn" href="index.html">Library</a>
    <a id="nextTop" class="nav-btn" href="#">Next</a>
  </div>

  <div class="info-bar">
    <span id="currentTitle"></span> · <a id="directPdfLink" href="#" target="_blank">Raw PDF</a>
  </div>

  <div id="bookPages">
    <div id="statusMsg" class="status-msg">Loading book pages...</div>
  </div>

  <div class="nav-bar bottom">
    <a id="prevBottom" class="nav-btn" href="#">Prev Book</a>
    <a class="nav-btn" href="index.html">All Books</a>
    <a id="nextBottom" class="nav-btn" href="#">Next Book</a>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    const books = [
      {
        title: "Book 1: A Dark Tale of Love, Laundry and Total Domination",
        file: "cyberhex_book1_a_dark_tale_of_love_laundry_and_total_domination.pdf"
      },
      {
        title: "Book 2: Porridge, Pit-Sniffs, and Pure Devotion",
        file: "cyberhex_book2_porridge_pit_sniffs_and_pure_devotion.pdf"
      },
      {
        title: "Book 3: Dead Zones, Demons, and Devotion",
        file: "cyberhex_book3_dead_zones_demons_and_devotion.pdf"
      },
      {
        title: "Book 4: A Dark Tale of Frostlands, Fur Coats, and Fake Accents",
        file: "cyberhex_book4_frostlands_fur_coats_and_fake_accents.pdf"
      }
    ];

    const params = new URLSearchParams(window.location.search);
    let idx = parseInt(params.get("book"), 10) - 1;
    if (isNaN(idx) || idx < 0 || idx >= books.length) idx = 0;

    const current = books[idx];
    document.title = current.title;
    document.getElementById("currentTitle").textContent = current.title;
    document.getElementById("directPdfLink").href = current.file;

    const prevTop = document.getElementById("prevTop");
    const prevBottom = document.getElementById("prevBottom");
    if (idx > 0) {
      prevTop.href = "reader.html?book=" + idx;
      prevBottom.href = "reader.html?book=" + idx;
      prevBottom.textContent = "Book " + idx;
    } else {
      prevTop.classList.add("hidden");
      prevBottom.classList.add("hidden");
    }

    const nextTop = document.getElementById("nextTop");
    const nextBottom = document.getElementById("nextBottom");
    if (idx < books.length - 1) {
      const nextNum = idx + 2;
      nextTop.href = "reader.html?book=" + nextNum;
      nextBottom.href = "reader.html?book=" + nextNum;
      nextBottom.textContent = "Book " + nextNum;
    } else {
      nextTop.classList.add("hidden");
      nextBottom.classList.add("hidden");
    }

    async function renderBook(url) {
      const container = document.getElementById("bookPages");
      const statusMsg = document.getElementById("statusMsg");
      try {
        const loadingTask = pdfjsLib.getDocument(url);
        const pdf = await loadingTask.promise;
        statusMsg.remove();

        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
          const page = await pdf.getPage(pageNum);
          const scale = 1.5;
          const viewport = page.getViewport({ scale: scale });

          const canvas = document.createElement("canvas");
          canvas.className = "pdf-page";
          const context = canvas.getContext("2d");
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          container.appendChild(canvas);
          await page.render({ canvasContext: context, viewport: viewport }).promise;
        }
      } catch (err) {
        statusMsg.innerHTML =
          'Could not display pages inline here. <a href="' +
          url +
          '" style="color:#e0b8d4;">Tap here to open the PDF</a>.';
      }
    }

    renderBook(current.file);
  </script>

</body>
</html>
