<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyberhex and Her 7 Husbands</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Pirata+One&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background-color: #0b090d;
      color: #e6dee9;
      font-family: 'Cormorant Garamond', Georgia, serif;
      min-height: 100vh;
      padding: 20px 16px 40px 16px;
      text-align: center;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
    }
    .nav-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }
    .nav-btn {
      background: linear-gradient(180deg, #281724 0%, #170f16 100%);
      color: #f3eaf7;
      text-decoration: none;
      padding: 11px 16px;
      border-radius: 6px;
      border: 1px solid #7a556e;
      font-family: 'Pirata One', Georgia, serif;
      font-size: 1.15rem;
      letter-spacing: 0.6px;
      white-space: nowrap;
    }
    .nav-btn:hover {
      background: linear-gradient(180deg, #3a2034 0%, #221520 100%);
      border-color: #b58ca8;
    }
    .nav-btn.hidden {
      visibility: hidden;
      pointer-events: none;
    }
    .card {
      background: linear-gradient(180deg, #1b121c 0%, #110c12 100%);
      border: 1px solid #6d5c78;
      border-radius: 8px;
      padding: 26px 20px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.8);
      margin-bottom: 20px;
    }
    .book-heading {
      font-family: 'Pirata One', Georgia, serif;
      font-size: 1.8rem;
      color: #f3eaf7;
      letter-spacing: 0.8px;
      margin: 0 0 18px 0;
    }
    .open-btn {
      display: block;
      width: 100%;
      background: linear-gradient(180deg, #4a233d 0%, #291322 100%);
      color: #fff6fc;
      text-decoration: none;
      padding: 16px 20px;
      border-radius: 6px;
      border: 1px solid #b58ca8;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.65);
      font-family: 'Pirata One', Georgia, serif;
      font-size: 1.45rem;
      letter-spacing: 1px;
      margin-bottom: 14px;
    }
    .open-btn:hover {
      background: linear-gradient(180deg, #5e2e4e 0%, #36192d 100%);
    }
    .helper-text {
      color: #bfb3c7;
      font-size: 1.15rem;
      margin: 0;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="nav-row">
      <a id="prevBtn" class="nav-btn" href="#">Prev Book</a>
      <a class="nav-btn" href="index.html">Library</a>
      <a id="nextBtn" class="nav-btn" href="#">Next Book</a>
    </div>

    <div class="card">
      <h1 id="bookTitle" class="book-heading"></h1>
      <a id="openPdfBtn" class="open-btn" href="#">Open Book (PDF)</a>
      <p class="helper-text">
        Tap above to read the PDF, then hit Back in your browser to return here and jump to the next book.
      </p>
    </div>

    <div class="nav-row">
      <a id="prevBtnBottom" class="nav-btn" href="#">Prev Book</a>
      <a class="nav-btn" href="index.html">All Books</a>
      <a id="nextBtnBottom" class="nav-btn" href="#">Next Book</a>
    </div>

  </div>

  <script>
    const books = [
      {
        title: "Book 1: A Dark Tale of Love, Laundry and Total Domination",
        file: "cyberhex_book1_a_dark_tale_of_love_laundry_and_total_domination.pdf"
      },
      {
        title: "Book 2: Porridge, Pit-Sniffs, and Pure Devotion",
        file: "cyberhex_book2_porridge_pit_sniffs_and_pure_devotion.pdf"
      },
      {
        title: "Book 3: Dead Zones, Demons, and Devotion",
        file: "cyberhex_book3_dead_zones_demons_and_devotion.pdf"
      },
      {
        title: "Book 4: A Dark Tale of Frostlands, Fur Coats, and Fake Accents",
        file: "cyberhex_book4_frostlands_fur_coats_and_fake_accents.pdf"
      }
    ];

    const params = new URLSearchParams(window.location.search);
    let idx = parseInt(params.get("book"), 10) - 1;
    if (isNaN(idx) || idx < 0 || idx >= books.length) idx = 0;

    const current = books[idx];
    document.title = current.title;
    document.getElementById("bookTitle").textContent = current.title;
    document.getElementById("openPdfBtn").href = current.file;

    const prevTop = document.getElementById("prevBtn");
    const prevBottom = document.getElementById("prevBtnBottom");
    if (idx > 0) {
      prevTop.href = "reader.html?book=" + idx;
      prevBottom.href = "reader.html?book=" + idx;
    } else {
      prevTop.classList.add("hidden");
      prevBottom.classList.add("hidden");
    }

    const nextTop = document.getElementById("nextBtn");
    const nextBottom = document.getElementById("nextBtnBottom");
    if (idx < books.length - 1) {
      const nextNum = idx + 2;
      nextTop.href = "reader.html?book=" + nextNum;
      nextBottom.href = "reader.html?book=" + nextNum;
    } else {
      nextTop.classList.add("hidden");
      nextBottom.classList.add("hidden");
    }
  </script>
</body>
</html>
